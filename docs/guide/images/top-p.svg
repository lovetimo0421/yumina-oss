<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" width="720" height="210" font-family="Inter, system-ui, sans-serif">
  <title>Top P: how many of the likely next words the model may choose from</title>
  <text x="20" y="28" fill="#f0f0f0" font-size="15" font-weight="600">The next word after "She opened the door and saw a"</text>
  <!-- bars: candidates by likelihood -->
  <g font-size="13">
    <rect x="20" y="52" width="300" height="22" rx="4" fill="#C9A25E"/>
    <text x="330" y="68" fill="#f0f0f0">stranger  34%</text>
    <rect x="20" y="80" width="210" height="22" rx="4" fill="#C9A25E"/>
    <text x="240" y="96" fill="#f0f0f0">shadow  24%</text>
    <rect x="20" y="108" width="150" height="22" rx="4" fill="#C9A25E"/>
    <text x="180" y="124" fill="#f0f0f0">cat  17%</text>
    <rect x="20" y="136" width="80" height="22" rx="4" fill="#555"/>
    <text x="110" y="152" fill="#9a9a9a">letter  9%</text>
    <rect x="20" y="164" width="40" height="22" rx="4" fill="#555"/>
    <text x="70" y="180" fill="#9a9a9a">dragon  5%  ... and hundreds more</text>
  </g>
  <!-- bracket for top p -->
  <path d="M 470 50 L 480 50 L 480 130 L 470 130" fill="none" stroke="#8fa3c7" stroke-width="2"/>
  <text x="492" y="82" fill="#8fa3c7" font-size="13" font-weight="600">Top P 0.75</text>
  <text x="492" y="100" fill="#bdbdbd" font-size="12">only these can be picked</text>
  <text x="492" y="116" fill="#bdbdbd" font-size="12">lower = fewer, safer choices</text>
</svg>
