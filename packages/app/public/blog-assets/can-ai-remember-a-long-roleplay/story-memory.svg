<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" font-family="Inter, system-ui, sans-serif">
  <title>What the AI reads on every turn</title>
  <text x="20" y="28" fill="#f0f0f0" font-size="15" font-weight="600">What the AI reads on every turn</text>
  <!-- world block -->
  <rect x="20" y="48" width="170" height="56" rx="8" fill="#2b2b2b" stroke="#C9A25E" stroke-width="2"/>
  <text x="105" y="72" fill="#f0f0f0" font-size="14" font-weight="600" text-anchor="middle">The world</text>
  <text x="105" y="92" fill="#bdbdbd" font-size="12" text-anchor="middle">fixed size, never cut</text>
  <!-- plus -->
  <text x="205" y="83" fill="#9a9a9a" font-size="20" text-anchor="middle">+</text>
  <!-- conversation timeline -->
  <rect x="222" y="48" width="104" height="56" rx="8" fill="#1f1f1f" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="274" y="72" fill="#8a8a8a" font-size="13" text-anchor="middle">not seen</text>
  <text x="274" y="92" fill="#777" font-size="11" text-anchor="middle">oldest scenes</text>
  <rect x="334" y="48" width="148" height="56" rx="8" fill="#2b2b2b" stroke="#8fa3c7" stroke-width="2"/>
  <text x="408" y="72" fill="#f0f0f0" font-size="14" font-weight="600" text-anchor="middle">Recap</text>
  <text x="408" y="92" fill="#bdbdbd" font-size="12" text-anchor="middle">older scenes as chapters</text>
  <rect x="482" y="48" width="218" height="56" rx="8" fill="#2b2b2b" stroke="#C9A25E" stroke-width="2"/>
  <text x="591" y="72" fill="#f0f0f0" font-size="14" font-weight="600" text-anchor="middle">Story memory</text>
  <text x="591" y="92" fill="#bdbdbd" font-size="12" text-anchor="middle">your last scenes, word for word</text>
  <!-- time arrow -->
  <line x1="222" y1="124" x2="690" y2="124" stroke="#777" stroke-width="1.5"/>
  <polygon points="690,124 680,119 680,129" fill="#777"/>
  <text x="222" y="142" fill="#8a8a8a" font-size="12">start of your story</text>
  <text x="700" y="142" fill="#8a8a8a" font-size="12" text-anchor="end">now</text>
  <!-- note -->
  <text x="20" y="180" fill="#bdbdbd" font-size="13">Story memory is the only part you set. The recap keeps the events of what fell out of it.</text>
</svg>
